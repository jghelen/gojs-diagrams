<header class="bar">
  <h1>Fund structure diagrams</h1>
  <a class="all-diagrams" [routerLink]="listUrl" title="The list of all diagrams of the database"
    >All diagrams</a
  >
  <label>
    <!-- No visible label: the name is for screen readers. -->
    <select
      aria-label="Data"
      [disabled]="busy()"
      (change)="loadDataset.emit($any($event.target).value)"
    >
      <!-- A diagram opened from the list is none of the app's own data. -->
      @if (datasetId() === storedDataset) {
        <option [value]="storedDataset" selected>From the database</option>
      }
      @for (dataset of datasets; track dataset.id) {
        <option [value]="dataset.id" [selected]="dataset.id === datasetId()">
          {{ dataset.label }}
        </option>
      }
    </select>
  </label>
  <!-- LE: legal entities, the nodes of the diagram. -->
  <span class="node-count" title="Number of legal entities on the diagram"
    >LE: {{ nodeCount() }}</span
  >
  <div class="bar-end">
    <button
      type="button"
      [title]="
        isEmpty() ? 'Styles: add a node first' : 'Set color and shape per legal entity field'
      "
      [disabled]="busy() || isEmpty()"
      (click)="openStyles.emit()"
    >
      <svg class="button-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 10c0-3.9-4.5-7-10-7z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle cx="7.5" cy="11.5" r="1.3" fill="#ef4444" />
        <circle cx="10" cy="7.5" r="1.3" fill="#f59e0b" />
        <circle cx="14.5" cy="7" r="1.3" fill="#22c55e" />
        <circle cx="17.5" cy="10.5" r="1.3" fill="#3b82f6" />
      </svg>
      Styles
    </button>
    <!-- A diagram without nodes has nothing to export or print. -->
    <select
      #actions
      class="actions-menu"
      aria-label="Actions"
      [disabled]="busy() || isEmpty()"
      (change)="runAction(actions)"
    >
      <option value="" selected hidden>Actions</option>
      <option value="save" disabled>Save</option>
      <option value="save-as" disabled>Save As</option>
      <option value="export-png">Export PNG</option>
      <option value="print">Print</option>
    </select>
    <button
      type="button"
      class="icon-button"
      title="Reset diagram"
      aria-label="Reset diagram"
      [disabled]="busy()"
      (click)="loadDataset.emit(datasetId())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 5v5h-5M19.4 10A8 8 0 1 0 20 13.5" />
      </svg>
    </button>
    <button
      type="button"
      class="icon-button"
      title="New diagram: start from an empty canvas"
      aria-label="New diagram"
      [disabled]="busy()"
      (click)="loadDataset.emit(blankDataset)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11.5v6M9 14.5h6"
        />
      </svg>
    </button>
    <button
      type="button"
      class="icon-button"
      aria-label="Developer tools"
      [class.current]="developerTools.shown()"
      [attr.aria-pressed]="developerTools.shown()"
      [title]="
        developerTools.shown()
          ? 'Hide the developer tools'
          : 'Developer tools: timings, history numbers and random edits'
      "
      [disabled]="busy()"
      (click)="developerTools.toggle()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" />
      </svg>
    </button>
  </div>
</header>
