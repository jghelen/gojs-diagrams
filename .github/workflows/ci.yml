# Checks the code twice on its way into main: formatting, lint, build, unit tests.
# The same checks run locally with `npm run verify`.
name: CI

on:
  # 1. When a pull request into main is opened, and again whenever commits are
  #    added to it, so that it is known to be sound before it is merged.
  pull_request:
    branches: [main]
    # "Ready for review" too: a pull request that was blocked (see the last job)
    # and is declared ready by hand is checked again.
    types: [opened, synchronize, reopened, ready_for_review]
  # 2. When something lands on main: a merged pull request, or a direct push.
  push:
    branches: [main]

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The Node version the project is developed with.
          node-version-file: .nvmrc
          cache: npm

      # Exactly the versions of package-lock.json.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The tests run in jsdom, so no browser has to be installed.
      - name: Unit tests
        run: npm test -- --watch=false

  # A workflow cannot switch off the "Merge pull request" button itself. What it
  # can do is turn the pull request into a draft, and GitHub does not merge
  # drafts. So: when the checks fail, the pull request becomes a draft and gets
  # the label below; when a later commit passes them, it is made ready again.
  # A pull request that somebody made a draft by hand has no label and is left alone.
  block-merge:
    name: Block merging while the checks fail
    needs: verify
    # Also when `verify` failed, which is what this job is for; not when the run was cancelled.
    # Only for pull requests from this repository: one from a fork may not change anything here.
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      # Labels belong to issues as far as permissions go.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      LABEL: checks-failed
    steps:
      - name: Checks failed, so make the pull request a draft
        if: needs.verify.result == 'failure'
        run: |
          gh label create "$LABEL" --force --color B60205 \
            --description "The checks failed. This pull request cannot be merged until they pass."
          gh api --method POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent
          gh pr ready "$PR" --undo

      - name: Checks pass, so make it ready again if this workflow blocked it
        if: needs.verify.result == 'success'
        run: |
          if gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name' | grep -qx "$LABEL"; then
            gh pr ready "$PR"
            gh api --method DELETE "repos/$GH_REPO/issues/$PR/labels/$LABEL" --silent
          fi
